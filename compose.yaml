# BirthDayMemo compose setup.
#
# Usage:
#   1. Edit the environment variables below (or export them / put them in a
#      .env file next to this file), then:
#        docker compose up -d --build
#   2. That's it — no interactive setup wizard. On first start the container
#      writes config.json from these variables and creates the admin account.
#      If BIRTHDAYMEMO_ADMIN_PASSWORD is empty or invalid, a random compliant
#      password is generated and printed once to the container logs:
#        docker compose logs birthdaymemo | grep -i password
#      Log in and change it afterwards.
#   3. Reset admin password: docker compose run --rm birthdaymemo -reset-admin-password
#
# Data (config.json, birthdaymemo.db, logs/, languages/) persists in the
# ./data directory (bind mount) next to the executable in /data.
# Environment variables win over config.json on every start and are
# written back to config.json, so compose is the source of truth.
#
# Guest service: birthdaymemo-guest below serves ONLY public share links
# (#/s/...) from the same ./data. Point your public hostname at it and keep
# the edit hostname (birthdaymemo) behind your VPN/firewall.

services:
  birthdaymemo:
    build: .
    image: birthdaymemo:latest
    container_name: birthdaymemo
    restart: unless-stopped
    ports:
      # Container side MUST equal BIRTHDAYMEMO_LISTEN_PORT.
      - "${HOST_PORT:-8080}:${BIRTHDAYMEMO_LISTEN_PORT:-8080}"
    environment:
      # Reminder emails are scheduled in local time; set your zone, e.g. TZ=Asia/Shanghai.
      TZ: ${TZ:-UTC}
      # Console/default language: en | zh.
      BIRTHDAYMEMO_LANGUAGE: ${BIRTHDAYMEMO_LANGUAGE:-en}
      # Listen address inside the container. Keep 0.0.0.0 (or ::) so the
      # published port is reachable; 127.0.0.1 would only listen on loopback.
      BIRTHDAYMEMO_LISTEN_ADDRESS: ${BIRTHDAYMEMO_LISTEN_ADDRESS:-0.0.0.0}
      # Listen port inside the container (must match the container side above).
      BIRTHDAYMEMO_LISTEN_PORT: ${BIRTHDAYMEMO_LISTEN_PORT:-8080}
      # Operation log retention days, 0 = unlimited.
      BIRTHDAYMEMO_RETENTION_DAYS: ${BIRTHDAYMEMO_RETENTION_DAYS:-14}
      # External base URL (with http(s)://) used for links in emails; empty = auto from request.
      BIRTHDAYMEMO_EXTERNAL_URL: ${BIRTHDAYMEMO_EXTERNAL_URL:-https://birthday.jujusb.com}
      # Admin account created on first start (username 3-10 chars).
      BIRTHDAYMEMO_ADMIN_USER: ${BIRTHDAYMEMO_ADMIN_USER:-admin}
      # Admin password (min 8 chars, must contain uppercase, lowercase and digits).
      # Empty/invalid = a random compliant password is generated and logged once.
      BIRTHDAYMEMO_ADMIN_PASSWORD: ${BIRTHDAYMEMO_ADMIN_PASSWORD:-password}
      # Tag name max length in characters (1-100, default 20).
      BIRTHDAYMEMO_TAG_NAME_MAX_LENGTH: ${BIRTHDAYMEMO_TAG_NAME_MAX_LENGTH:-20}
    volumes:
      - ./data:/data

  # Sharelink-only service (guest mode).
  #
  # Same image, same ./data mount, but runs with --guest-only: it mounts ONLY
  #   GET /api/public/s/{token}[/calendar], GET /api/i18n, GET /api/languages
  # and the static frontend. /api/login, all authenticated APIs, the reminder
  # scheduler and the audit cleanup never run here (no duplicate emails, no
  # writes — except process-local log files).
  #
  # Wiring:
  #   - Publish it on its own host port and point your PUBLIC hostname at it
  #     (e.g. view.example.com -> GUEST_HOST_PORT). Harden further with a path
  #     allowlist on your own reverse proxy (see README for snippets).
  #   - Keep the edit hostname (birthdaymemo service) behind your VPN/firewall.
  #   - On a fresh volume, start the edit service FIRST so the admin account
  #     and database exist; the guest service exits otherwise.
  #   - No BIRTHDAYMEMO_ADMIN_* here on purpose: guest must never create users.
  birthdaymemo-guest:
    build: .
    image: birthdaymemo:latest
    container_name: birthdaymemo-guest
    restart: unless-stopped
    command: ["--guest-only"]
    ports:
      # Container side MUST equal BIRTHDAYMEMO_GUEST_PORT.
      - "${GUEST_HOST_PORT:-8081}:${BIRTHDAYMEMO_GUEST_PORT:-8081}"
    environment:
      TZ: ${TZ:-UTC}
      BIRTHDAYMEMO_LANGUAGE: ${BIRTHDAYMEMO_LANGUAGE:-en}
      # Keep 0.0.0.0 so the published port is reachable.
      BIRTHDAYMEMO_LISTEN_ADDRESS: 0.0.0.0
      # Guest listen port inside the container (must match the container side above).
      BIRTHDAYMEMO_LISTEN_PORT: ${BIRTHDAYMEMO_GUEST_PORT:-8081}
      BIRTHDAYMEMO_GUEST_ONLY: 1
      # Public base URL (with http(s)://) used when building share-link URLs.
      # Set this to the PUBLIC hostname, e.g. https://view.example.com.
      BIRTHDAYMEMO_EXTERNAL_URL: ${BIRTHDAYMEMO_GUEST_EXTERNAL_URL:-}
    volumes:
      - ./data:/data
